<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HospiManage{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if current_user.is_authenticated %}
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}">HospiManage</a>
    <nav>
      <a href="{{ url_for('patients') }}">Patients</a>
      <a href="{{ url_for('appointments') }}">Appointments</a>
      <a href="{{ url_for('records') }}">EHR</a>
      <form method="post" action="{{ url_for('logout') }}" class="inline-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="link-button" type="submit">Sign out</button>
      </form>
    </nav>
  </header>
  {% endif %}
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
